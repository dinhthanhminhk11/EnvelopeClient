# Per-project configuration of this core build, read by build.rs. Public values only. Another project keeps its own
# copy of this file and points DOODLEART_PROJECT_CONF at it; a release build then also needs
# DOODLEART_PROJECT_CONF_ALLOW_RELEASE=1 (rules at the top of build.rs).
# Format: one `KEY = value` per line, `#` starts a comment, an unknown key stops the build.

# Project id, [a-z0-9-]{1,32}. Reported by the C ABI init reply and the iOS manifest only: never on the wire, not in
# the JNI replies.
PROJECT_ID = doodleart

# Seed of the obfstr string obfuscation, [A-Za-z0-9_-]{16,64}, one per project (projects with the same seed share the
# obfuscation). build-android.sh and build-ios.sh export it for the obfstr crate; build.rs checks that the environment
# agrees.
OBFSTR_SEED = Qjq5wM9NPRwk37Vymc_Upb5scdcaG4xU

# Key of the source path remapping of the shipped libraries, 32 to 64 lowercase hex characters, one per project
# (tools/remap-paths.sh): panic locations name src/m<first 8 hex of SHA-256(REMAP_SALT || 0x00 || path)>.rs, so a
# name cannot be checked against a guessed file name without this value. Required by build-android.sh and
# build-ios.sh. Not secret like a key (it only hides file names) but never shipped: keep it out of logs. A new value
# re-encodes the obfstr strings of every library (obfstr keys derive from the remapped file name).
REMAP_SALT = 0441fd297f209f98c3317f3ca75e8c22

# APK signing-certificate allowlists of the Android release and QA build types: SHA-256 of the certificate, hex with
# or without `:` (as keytool -list -v prints it). Repeat the key for several certificates. A release or QA build without
# a digest of its own type stops. Debug digests differ per machine: config/debug-certs.conf.
#
# DoodleArt has no Android app yet (android/ is empty). The two values below are placeholders (SHA-256 of a fixed
# sentence, matching no certificate) so the host `cargo test --features build-release / build-qa` builds; no APK can
# pass them. Replace them with the Play App Signing certificate (release, = ANDROID_SIGNING_CERT_SHA256 of the
# production server) and the upload key (QA) before the first Android build.
RELEASE_APK_CERT_SHA256 = 598359c6c743530f324e80207c64d68ee95e169aeddb38e85ead7dc3af114655
QA_APK_CERT_SHA256 = 9a66a46a0247df31fbcb43150d7fbb68ae94e0e5001bdaff55de7569de98e815
