# Server Ed25519 public keys embedded in the RELEASE build type (production app service,
# doodle-api.cemsoftwareltd.com). Format: raw 32-byte public key as 64 lowercase hex chars, and the kid the server sends
# (ENVELOPE_SIGNING_KID of the production deploy, deploy/README.md). `next` is the key the server will rotate to; leave
# both next.* lines empty when there is none.
#
# NOT SET YET: the owner supplies the production public key (never the private key). Until then the build refuses to
# run (a value starts with REPLACE), so no release library can ship without the right key. Derive the public key from
# the production seed (ENVELOPE_SIGNING_KEY, base64url of 32 bytes) on a trusted machine:
#   node -e 'const c=require("crypto");const s=Buffer.from(process.argv[1],"base64url");const k=c.createPrivateKey({key:Buffer.concat([Buffer.from("302e020100300506032b657004220420","hex"),s]),format:"der",type:"pkcs8"});console.log(c.createPublicKey(k).export({format:"der",type:"spki"}).subarray(12).toString("hex"))' "$ENVELOPE_SIGNING_KEY"
# project / build_type: what these keys are for; build.rs and tools/check-macho.sh refuse them for another project
# or build type (rules at the top of build.rs).
project = doodleart
build_type = release
current.kid = REPLACE_WITH_PRODUCTION_KID
current.public_key = REPLACE_WITH_PRODUCTION_ED25519_PUBLIC_KEY_HEX
next.kid =
next.public_key =
