# Server Ed25519 public keys embedded in the QA build type (staging backend). Format: see server-keys.release.conf.
# DoodleArt has no staging backend with its own key yet: the build refuses to run while a value starts with REPLACE.
# QA must never embed the production key.
project = doodleart
build_type = qa
current.kid = REPLACE_WITH_STAGING_KID
current.public_key = REPLACE_WITH_STAGING_ED25519_PUBLIC_KEY_HEX
next.kid =
next.public_key =
