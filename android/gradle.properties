org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Build type of the Rust core packed into the APK: debug | qa | release. It selects the embedded server keys
# (../config/server-keys.<type>.conf). qa and release refuse to build until real keys are configured.
envelope.core.buildType=debug

# true: Gradle runs ../build-android.sh before every build (needs Rust, cargo-ndk and an NDK >= 27).
# false: use the libraries already in ../target/jniLibs/<buildType>.
envelope.core.autoBuild=true
